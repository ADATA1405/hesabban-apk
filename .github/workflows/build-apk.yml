name: Build APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install npm packages
        run: npm install

      - name: Create Android project (first run)
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Build release APK (unsigned)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Sign release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BT="$SDK/build-tools/$(ls $SDK/build-tools | sort -V | tail -1)"
          echo "Using build-tools: $BT"
          cd android/app/build/outputs/apk/release
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ks.jks"
          "$BT/zipalign" -f -p 4 app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/ks.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out hesabban-release.apk aligned.apk
          "$BT/apksigner" verify hesabban-release.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: hesabban-apk-release
          path: android/app/build/outputs/apk/release/hesabban-release.apk
