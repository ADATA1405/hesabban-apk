name: make-keystore
on:
  workflow_dispatch:
jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - name: ساخت keystore و خروجی secrets
        run: |
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -v -keystore release.jks \
            -storepass "$PASS" -keypass "$PASS" \
            -alias hesabban -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Hesabban, OU=App, O=Hesabban, L=Tehran, C=IR"
          B64=$(base64 -w0 release.jks)
          {
            echo "KEY_ALIAS=hesabban"
            echo "KEYSTORE_PASSWORD=$PASS"
            echo "KEY_PASSWORD=$PASS"
            echo "KEYSTORE_BASE64=$B64"
          } > secrets.txt
      - uses: actions/upload-artifact@v4
        with:
          name: keystore-secrets
          path: secrets.txt
          retention-days: 1
